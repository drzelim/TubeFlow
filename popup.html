<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TubeFlow</title>
    <link rel="icon" href="icons/icon-32.png" type="image/png">
    <link rel="stylesheet" href="popup.css">
    <script src="scripts/settings.js" defer></script>
    <script src="popup.js" defer></script>
</head>
<body>
<header><h1><img src="icons/icon-32.png" width="28" height="28" alt="">TubeFlow</h1></header>
<main>
    <label class="shorts-row" for="hide-shorts">
        <span>Скрывать Shorts</span>
        <input id="hide-shorts" type="checkbox" role="switch" disabled>
    </label>
    <section aria-labelledby="speed-label">
        <div class="speed-row">
            <label id="speed-label" for="speed">Скорость видео</label>
            <div class="speed-controls">
                <button id="speed-decrease" type="button" aria-label="Уменьшить скорость" title="Уменьшить скорость" disabled>−</button>
                <output id="speed-value" for="speed" aria-live="polite"></output>
                <button id="speed-increase" type="button" aria-label="Увеличить скорость" title="Увеличить скорость" disabled>+</button>
            </div>
        </div>
        <input id="speed" type="range" disabled>
        <div class="limits" aria-hidden="true"><span id="speed-min"></span><span id="speed-max"></span></div>
    </section>
    <p id="status" role="status" aria-live="polite"></p>
</main>
</body>
</html>
